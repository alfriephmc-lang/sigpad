<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Document Receiving Proof Pad</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-md mx-auto mb-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
      <h1 class="text-base font-bold tracking-tight text-slate-100">Document Receiving Proof</h1>
    </div>
    <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-mono">v2.4 Mobile</span>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md mx-auto space-y-4 mb-8">
    
    <!-- Document Info Card -->
    <div class="glass-card rounded-2xl p-4 shadow-xl space-y-3">
      <h2 class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Document Info</h2>
      
      <!-- Document Title -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Document Title</label>
        <input type="text" id="docTitle" placeholder="e.g., Transmittal - Q3 Financial Report" 
          class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
      </div>

      <!-- Received By -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Received By</label>
        <input type="text" id="receivedBy" placeholder="Recipient Full Name" 
          class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
      </div>

      <!-- Receiving Department (Smart Dropdown) -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Receiving Department</label>
        <input list="deptList" id="receivingDept" placeholder="Select or type department..." 
          class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
        <datalist id="deptList">
          <!-- Populated dynamically -->
        </datalist>
      </div>

      <!-- Recipient Email Address -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
        <input type="email" id="recipientEmail" placeholder="recipient@company.com" 
          class="w-full px-3 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
      </div>
    </div>

    <!-- Signature Pad Card -->
    <div class="glass-card rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Signature Pad</h2>
        <div class="flex items-center space-x-2">
          <!-- Color Pickers -->
          <button onclick="setPenColor('#f8fafc')" class="w-5 h-5 rounded-full bg-slate-100 border border-slate-600 focus:outline-none" title="White"></button>
          <button onclick="setPenColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 focus:outline-none" title="Blue"></button>
          <button onclick="setPenColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 focus:outline-none" title="Red"></button>
          <button onclick="clearCanvas()" class="text-xs text-slate-400 hover:text-slate-200 underline ml-2">Clear</button>
        </div>
      </div>

      <!-- Canvas Wrapper -->
      <div class="relative w-full h-44 bg-slate-900/90 border border-slate-700 rounded-xl overflow-hidden shadow-inner">
        <canvas id="sigCanvas" class="w-full h-full cursor-crosshair"></canvas>
        <div class="absolute bottom-2 left-3 pointer-events-none text-[10px] text-slate-600 tracking-widest uppercase select-none">
          Sign inside box above
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-2.5 pt-1">
      <button onclick="confirmAndViewProof()" id="confirmBtn"
        class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-900/30 transition-all flex items-center justify-center space-x-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        <span>Confirm & View Proof</span>
      </button>

      <button onclick="triggerSendEmail()" id="sendEmailBtn" disabled
        class="w-full py-3 px-4 bg-slate-800 text-slate-500 cursor-not-allowed font-semibold rounded-xl text-sm border border-slate-700 transition-all flex items-center justify-center space-x-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span>Send Email Notification</span>
      </button>
    </div>

  </main>

  <!-- Success Toast / Notification Modal -->
  <div id="proofModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-700 animate-in fade-in zoom-in duration-200">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
        <div>
          <span id="modalDocNo" class="text-xs font-mono text-emerald-400 font-bold uppercase tracking-wider">DOC-XXXXX</span>
          <h3 class="text-base font-bold text-slate-100">Receiving Receipt</h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="space-y-2 text-xs text-slate-300">
        <div class="flex justify-between py-1 border-b border-slate-800">
          <span class="text-slate-500">Document Title:</span>
          <span id="modalTitle" class="font-medium text-slate-100 text-right">--</span>
        </div>
        <div class="flex justify-between py-1 border-b border-slate-800">
          <span class="text-slate-500">Received By:</span>
          <span id="modalReceivedBy" class="font-medium text-slate-100 text-right">--</span>
        </div>
        <div class="flex justify-between py-1 border-b border-slate-800">
          <span class="text-slate-500">Department:</span>
          <span id="modalDept" class="font-medium text-slate-100 text-right">--</span>
        </div>
        <div class="flex justify-between py-1 border-b border-slate-800">
          <span class="text-slate-500">Recipient Email:</span>
          <span id="modalEmail" class="font-medium text-slate-100 text-right">--</span>
        </div>
        <div class="flex justify-between py-1">
          <span class="text-slate-500">Timestamp:</span>
          <span id="modalTime" class="font-mono text-slate-300 text-right">--</span>
        </div>
      </div>

      <!-- Captured Signature Preview -->
      <div class="space-y-1">
        <span class="text-[10px] uppercase font-semibold text-slate-500">Authorized Signature</span>
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-2 flex items-center justify-center h-20">
          <img id="modalSigImage" src="" alt="Signature Preview" class="max-h-full object-contain filter invert opacity-90">
        </div>
      </div>

      <div class="pt-2 flex space-x-2">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-colors">
          Close
        </button>
        <button onclick="downloadProofReceipt()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition-colors">
          Download PNG
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full max-w-md mx-auto text-center text-[10px] text-slate-600">
    Secure Document Receiving Gateway &bull; Powered by Supabase
  </footer>

  <!-- Script Logic -->
  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://dideaglufjrautyomrzm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-b5NQcuBhQk57Y-tXzDe_A_HR3Im8CH";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Smart Dropdown Initialization for Departments
    const defaultDepartments = ["Administrative", "Finance", "Human Resources", "Information Technology", "Logistics", "Operations", "Quality Assurance"];
    
    function loadDepartments() {
      let savedDepts = JSON.parse(localStorage.getItem('smart_receiving_depts') || JSON.stringify(defaultDepartments));
      const datalist = document.getElementById('deptList');
      datalist.innerHTML = '';
      savedDepts.forEach(dept => {
        const option = document.createElement('option');
        option.value = dept;
        datalist.appendChild(option);
      });
    }

    function saveNewDepartment(deptName) {
      if (!deptName) return;
      let savedDepts = JSON.parse(localStorage.getItem('smart_receiving_depts') || JSON.stringify(defaultDepartments));
      if (!savedDepts.includes(deptName)) {
        savedDepts.push(deptName);
        localStorage.setItem('smart_receiving_depts', JSON.stringify(savedDepts));
        loadDepartments();
      }
    }

    window.addEventListener('DOMContentLoaded', loadDepartments);

    // Signature Canvas Setup
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let penColor = '#f8fafc';
    let currentConfirmedRecord = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.strokeStyle = penColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);

    function setPenColor(color) {
      penColor = color;
      ctx.strokeStyle = penColor;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Drawing Event Listeners (Mouse & Touch)
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDraw(e) {
      isDrawing = true;
      const pos = getMousePos(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getMousePos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = penColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    }

    function stopDraw() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    function isCanvasBlank(canvasObj) {
      const blank = document.createElement('canvas');
      blank.width = canvasObj.width;
      blank.height = canvasObj.height;
      return canvasObj.toDataURL() === blank.toDataURL();
    }

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    // Confirm & View Proof workflow
    async function confirmAndViewProof() {
      const docTitle = document.getElementById('docTitle').value.trim();
      const receivedBy = document.getElementById('receivedBy').value.trim();
      const receivingDept = document.getElementById('receivingDept').value.trim();
      const recipientEmail = document.getElementById('recipientEmail').value.trim();

      if (!docTitle || !receivedBy || !receivingDept || !recipientEmail) {
        alert('Please complete all document and recipient information fields.');
        return;
      }

      if (isCanvasBlank(canvas)) {
        alert('Please provide a signature before confirming.');
        return;
      }

      saveNewDepartment(receivingDept);

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="animate-pulse">Saving to Supabase...</span>';

      try {
        // 1. Upload signature image to Supabase Storage bucket
        const signatureDataURL = canvas.toDataURL('image/png');
        const signatureBlob = dataURLtoBlob(signatureDataURL);
        const fileName = `sig_${Date.now()}_${Math.random().toString(36.substring(2, 7))}.png`;

        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('signatures')
          .upload(fileName, signatureBlob, { contentType: 'image/png' });

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('signatures')
          .getPublicUrl(fileName);

        const signatureUrl = publicUrlData.publicUrl;
        const timestampStr = new Date().toLocaleString();

        // 2. Insert record into document_proofs table (doc_no auto-generated via trigger)
        const { data: insertData, error: insertError } = await supabaseClient
          .from('document_proofs')
          .insert([{
            doc_title: docTitle,
            received_by: receivedBy,
            receiving_dept: receivingDept,
            recipient_email: recipientEmail,
            signature_url: signatureUrl
          }])
          .select('doc_no, created_at')
          .single();

        if (insertError) throw insertError;

        const docNo = insertData.doc_no;

        currentConfirmedRecord = {
          docNo,
          docTitle,
          receivedBy,
          receivingDept,
          recipientEmail,
          signatureUrl,
          timestamp: timestampStr
        };

        // Populate Modal view
        document.getElementById('modalDocNo').innerText = docNo;
        document.getElementById('modalTitle').innerText = docTitle;
        document.getElementById('modalReceivedBy').innerText = receivedBy;
        document.getElementById('modalDept').innerText = receivingDept;
        document.getElementById('modalEmail').innerText = recipientEmail;
        document.getElementById('modalTime').innerText = timestampStr;
        document.getElementById('modalSigImage').src = signatureDataURL;

        document.getElementById('proofModal').classList.remove('hidden');

        // Enable Send Email button
        const sendBtn = document.getElementById('sendEmailBtn');
        sendBtn.disabled = false;
        sendBtn.className = "w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-900/30 transition-all flex items-center justify-center space-x-2";

      } catch (err) {
        console.error('Supabase Error:', err);
        alert('Error saving record: ' + (err.message || JSON.stringify(err)));
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          <span>Confirm & View Proof</span>
        `;
      }
    }

    function closeModal() {
      document.getElementById('proofModal').classList.add('hidden');
    }

    function downloadProofReceipt() {
      if (!currentConfirmedRecord) return;
      const link = document.createElement('a');
      link.download = `${currentConfirmedRecord.docNo}_Receiving_Proof.png`;
      link.href = canvas.toDataURL();
      link.click();
    }

    // Send Email Action
    function triggerSendEmail() {
      if (!currentConfirmedRecord) return;

      const recipient = currentConfirmedRecord.recipientEmail;
      const subject = encodeURIComponent(`Document Receiving Notice - [${currentConfirmedRecord.docNo}] ${currentConfirmedRecord.docTitle}`);
      
      const emailBody = `Dear ${currentConfirmedRecord.receivedBy},\n\nThank you for receiving the document. Kindly contact us in this local 664 for updates.\n\nDocument Information:\n- Document Title: ${currentConfirmedRecord.docTitle}\n- Document No: ${currentConfirmedRecord.docNo}\n- Receiving Department: ${currentConfirmedRecord.receivingDept}\n- Timestamp: ${currentConfirmedRecord.timestamp}\n\nBest regards,\nReceiving & Dispatch Department`;

      const mailtoUrl = `mailto:${recipient}?subject=${subject}&body=${encodeURIComponent(emailBody)}`;
      window.location.href = mailtoUrl;
    }
  </script>

  <ElicitationsGroup message="To take this document verification process further:">
    <Elicitation label="Build an admin search dashboard to lookup document proofs by department or date" query="Build an admin search dashboard interface connected to Supabase to filter document proofs by department, recipient name, or date range." />
    <Elicitation label="Add a QR code generator for instant verification scanning" query="Add a QR code generation feature using qrious or qrcode.js that embeds the unique doc_no and signature URL for instant physical tag scanning." />
  </ElicitationsGroup>

</body>
</html>
